<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiLocker | Apna Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{
            --bg-1:#faf8f4; --bg-2:#f1ece1;
            --ink:#14213d; --ink-soft:rgba(20,33,61,0.62); --ink-faint:rgba(20,33,61,0.38);
            --gold:#c9a227; --gold-deep:#93710f; --gold-soft:rgba(201,162,39,0.12);
            --glass:rgba(255,255,255,0.55); --glass-strong:rgba(255,255,255,0.78); --glass-border:rgba(255,255,255,0.9);
            --line:rgba(20,33,61,0.1);
            --shadow:0 20px 60px rgba(20,33,61,0.10);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html,body{ height:100%; }
        body { background:linear-gradient(180deg,var(--bg-1),var(--bg-2)); color:var(--ink); overflow-x: hidden; position:relative; }
        .blob{ position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; }
        .blob-gold{ width:420px; height:420px; background:rgba(212,175,55,0.30); top:-140px; right:-110px; }
        .blob-navy{ width:460px; height:460px; background:rgba(20,33,61,0.10); bottom:-180px; left:-150px; }
        nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 18px 5%; background: rgba(255,255,255,0.65); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--line); z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: clamp(1.1rem, 4vw, 1.5rem); color: var(--ink); font-weight: 800; }
        .logo span { color: var(--gold-deep); font-family: 'Poppins', sans-serif; font-size: 0.58rem; display: block; letter-spacing: 3px; }
        .menu-btn { font-size: 1.6rem; color: var(--gold-deep); cursor: pointer; background: none; border: none; transition: 0.3s; }
        .sidebar { position: fixed; top: 0; right: -340px; width: 310px; height: 100vh; background: rgba(255,255,255,0.85); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border-left: 1px solid var(--glass-border); transition: 0.4s ease; z-index: 2000; padding: 40px 20px; box-shadow: -20px 0 60px rgba(20,33,61,0.12); }
        .sidebar.active { right: 0; }
        .close-btn { font-size: 1.8rem; color: var(--ink); cursor: pointer; float: right; margin-bottom: 30px; }
        .sidebar-links { display: flex; flex-direction: column; gap: 10px; clear: both; }
        .sidebar-links a { color: var(--ink); text-decoration: none; font-size: 1rem; padding: 14px; border-radius:12px; display: flex; align-items: center; gap: 14px; transition: 0.25s; }
        .sidebar-links a:hover { color: var(--gold-deep); background: var(--gold-soft); }
        .page-content { position:relative; z-index:1; margin-top: 130px; padding: 20px 5% 80px; max-width: 620px; margin-left: auto; margin-right: auto; text-align: center; }
        .portal-card { display: flex; flex-direction: column; align-items: center; padding: 44px 28px; border-radius: 24px; background: var(--glass-strong); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: var(--shadow); position:relative; }
        .portal-card::before{ content:""; position:absolute; top:-1px; left:-1px; width:34px; height:34px; border-top:2px solid var(--gold); border-left:2px solid var(--gold); border-radius:24px 0 0 0; }
        .portal-card::after{ content:""; position:absolute; bottom:-1px; right:-1px; width:34px; height:34px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold); border-radius:0 0 24px 0; }
        .portal-icon { font-size: 46px; color: var(--gold-deep); margin-bottom: 20px; }
        .portal-card h2 { font-family: 'Fraunces', serif; font-weight:600; font-size: 1.9rem; margin-bottom: 10px; color:var(--ink); }
        .portal-card p { font-size: 14.5px; color: var(--ink-soft); margin-bottom: 30px; max-width:42ch; }
        .go-btn { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg,var(--gold),var(--gold-deep)); color: #fff; text-decoration: none; padding: 14px 30px; font-weight: 600; border-radius: 14px; transition: 0.2s; box-shadow:0 10px 24px rgba(147,113,15,0.25); }
        .go-btn:hover { transform: translateY(-2px); box-shadow:0 12px 28px rgba(147,113,15,0.32); }
    </style>
</head>
<body>
    <div class="blob blob-gold"></div>
    <div class="blob blob-navy"></div>

    <nav>
        <div class="logo">APNA <span>LIBRARY</span></div>
        <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </nav>

    <div class="sidebar" id="sidebar">
        <i class="fas fa-times close-btn" onclick="toggleSidebar()"></i>
        <div class="sidebar-links">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="papers.html"><i class="fa-solid fa-file-lines"></i> CBSE Papers</a>
            <a href="curricular.html"><i class="fa-solid fa-book-open-reader"></i> CBSE Curricular</a>
            <a href="ebook.html"><i class="fa-solid fa-book"></i> Apna Library</a>
            <a href="digilocker.html" style="color: var(--gold-deep); background: var(--gold-soft);"><i class="fa-solid fa-cloud-arrow-down"></i> DigiLocker</a>
            <a href="pariksha.html"><i class="fa-solid fa-laptop-file"></i> Pariksha Sangam</a>
            <a href="cbse.html"><i class="fa-solid fa-globe"></i> CBSE Official</a>
            <a href="updates.html"><i class="fas fa-bell"></i> New Updates</a>
        </div>
    </div>

    <div class="page-content">
        <div class="portal-card">
            <div class="portal-icon"><i class="fa-solid fa-cloud-arrow-down"></i></div>
            <h2>DigiLocker Portal</h2>
            <p>Access your official CBSE Marksheets, Passing Certificates, and Migration Certificates securely via DigiLocker.</p>
            <a href="https://www.digilocker.gov.in/web/dashboard/issuers/000027" target="_blank" class="go-btn">Open DigiLocker <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
        </div>
    </div>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
    </script>
</body>
</html>

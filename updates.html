<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Notices | Apna Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-1:#faf8f4; --bg-2:#f1ece1;
            --ink:#14213d; --ink-soft:rgba(20,33,61,0.62); --ink-faint:rgba(20,33,61,0.38);
            --gold:#c9a227; --gold-deep:#93710f; --gold-soft:rgba(201,162,39,0.12);
            --glass:rgba(255,255,255,0.55); --glass-strong:rgba(255,255,255,0.78); --glass-border:rgba(255,255,255,0.9);
            --line:rgba(20,33,61,0.1);
            --shadow:0 20px 60px rgba(20,33,61,0.10);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html,body{ height:100%; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg,var(--bg-1),var(--bg-2));
            color: var(--ink);
            position: relative;
            overflow-x: hidden;
        }
        .blob{ position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; }
        .blob-gold{ width:420px; height:420px; background:rgba(212,175,55,0.30); top:-140px; right:-110px; }
        .blob-navy{ width:460px; height:460px; background:rgba(20,33,61,0.10); bottom:-180px; left:-150px; }

        /* HEADER — frosted glass */
        header {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: var(--ink);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--line);
        }
        .logo-section { display: flex; align-items: center; gap: 15px; }
        .school-logo {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, var(--gold) 0%, #f0c94a 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #fff;
        }
        .school-info h1 { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--ink); }
        .school-info p { font-size: 11px; color: var(--gold-deep); letter-spacing: 1px; text-transform: uppercase; }

        .back-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.6);
            color: var(--ink);
            text-decoration: none;
            border-radius: 50px;
            border: 1px solid var(--line);
            font-size: 14px;
            transition: 0.3s;
        }
        .back-btn:hover { background: linear-gradient(135deg,var(--gold),var(--gold-deep)); color: #fff; border-color: transparent; }

        /* NOTICE BOARD SECTION */
        .container { position: relative; z-index: 1; max-width: 1000px; margin: 40px auto; padding: 0 5%; min-height: 70vh; }
        .page-title {
            text-align: center;
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 32px;
            color: var(--ink);
            margin-bottom: 40px;
            border-bottom: 1px dashed var(--line);
            padding-bottom: 15px;
        }
        .page-title span { color: var(--gold-deep); }

        .notices-grid { display: flex; flex-direction: column; gap: 20px; }

        .notice-card {
            background: var(--glass-strong);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            padding: 25px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            border-left: 3px solid var(--gold);
            box-shadow: var(--shadow);
            transition: 0.3s;
            animation: slideUp 0.4s ease;
        }
        .notice-card:hover { transform: translateY(-3px); }

        .notice-card h3 { color: var(--ink); margin-bottom: 10px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .notice-card h3 i { color: var(--gold-deep); }
        .notice-card p { color: var(--ink-soft); font-size: 15px; line-height: 1.6; margin-bottom: 15px; }
        .notice-card .link-btn { color: var(--gold-deep); font-weight: 600; text-decoration: none; font-size: 14px; }
        .notice-card .link-btn:hover { text-decoration: underline; }

        .notice-meta {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--line);
        }
        .notice-date { font-size: 12px; color: var(--ink-faint); font-weight: 500; }
        .authority { font-size: 12px; color: var(--ink); font-weight: 600; background: var(--gold-soft); padding: 4px 10px; border-radius: 4px; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader { text-align: center; padding: 50px; color: var(--gold-deep); font-size: 18px; }

        /* FOOTER */
        footer { position: relative; z-index: 1; background: rgba(255,255,255,0.55); backdrop-filter: blur(20px) saturate(180%); color: var(--ink-soft); text-align: center; padding: 20px; margin-top: 40px; font-size: 13px; border-top: 1px solid var(--line); }
    </style>
</head>
<body>
<div class="blob blob-gold"></div>
<div class="blob blob-navy"></div>

<!-- Header -->
<header>
    <div class="logo-section">
        <div class="school-logo"><i class="fas fa-book-reader"></i></div>
        <div class="school-info">
            <h1>APNA LIBRARY</h1>
            <p>Notice Board</p>
        </div>
    </div>
    <!-- Back to home link -->
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
</header>

<!-- Notice Board Content -->
<div class="container">
    <h2 class="page-title">Official <span>Notices & Updates</span></h2>
    
    <div class="notices-grid" id="noticesContainer">
        <!-- Spinner while loading -->
        <div class="loader">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 10px;">Loading notices...</p>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Apna Library | Official Notice Board</p>
</footer>

<!-- Firebase Connection Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tumhara Database Address
    const firebaseConfig = {
        apiKey: "AIzaSyDWixU7YycVXE7T6mo51Ym6OO_yMfZ8SM0",
        authDomain: "djps-website-3a826.firebaseapp.com",
        projectId: "djps-website-3a826"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadNotices() {
        const container = document.getElementById('noticesContainer');
        try {
            const q = query(collection(db, "Notices"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            
            if(snapshot.empty) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px; background: white; border-radius: 12px; color: #999;">
                        <i class="fas fa-inbox fa-3x" style="margin-bottom: 15px; color: #ccc;"></i>
                        <p>No new notices available at the moment.</p>
                    </div>`;
                return;
            }

            let html = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = new Date(data.timestamp?.toDate?.() || Date.now()).toLocaleDateString('en-IN', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });
                
                html += `
                    <div class="notice-card">
                        <h3><i class="fas fa-bell"></i> ${data.title}</h3>
                        <p>${data.description}</p>
                        ${data.link ? `<a href="${data.link}" target="_blank" class="link-btn"><i class="fas fa-external-link-alt"></i> View Document / Link</a>` : ''}
                        
                        <div class="notice-meta">
                            <span class="notice-date"><i class="fas fa-calendar-alt"></i> ${date}</span>
                            <span class="authority">By Admin (DJPS)</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch(e) {
            console.error(e);
            container.innerHTML = '<div style="text-align:center; color:red; padding:20px;">Unable to load notices. Please check your internet connection.</div>';
        }
    }

    loadNotices();
</script>

</body>
</html>
